# 🔬 مسبار تشخيص ظل xG — تشغيل يدوي فقط (عطل صفر الجمع، 13 أغسطس 2026).
#
# سبب الوجود: مفتاح Sportmonks في GitHub Secrets ولا يصل إلى أحد، فالطريقة
# الوحيدة لرؤية ما يرجعه المزوّد فعلاً هي طباعته في سجل Actions.
#
# workflow مستقل عمداً لا خطوة داخل predict_v2: التشخيص يدوي وعلى الطلب،
# ولا يجوز أن يضيف ولو ثانية واحدة أو نداءً واحداً إلى التشغيلة الصباحية.
# قراءة محضة: لا يكتب أي ملف، ولا يلتزم (commit) بشيء، وصفر تأثير على أي محرك.
name: 🔬 xG Shadow Probe

on:
  workflow_dispatch:
    inputs:
      day:
        description: "اليوم المراد فحصه (YYYY-MM-DD) — اتركه فارغاً ليفحص أمس"
        required: false
        type: string
      mode:
        description: "probe = تشخيص التغطية والسقف | table = جدول xG للمقارنة مع FBref"
        required: false
        default: probe
        type: choice
        options: [probe, table]

# قراءة فقط: المسبار لا يكتب في المستودع إطلاقاً
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # المفتاح يصل عبر البيئة إلى الترويسة فقط ولا يُطبع أبداً (قاعدة الأسرار 3).
      # PROBE_DAY يمرّ عبر البيئة لا بالحقن المباشر في سطر الأمر: إدخال المستخدم
      # المحقون في run يفتح باب حقن أوامر الصدفة (script injection) — والاقتباس
      # حول "$PROBE_DAY" يجعل الفراغ وسيطاً فارغاً يتخطاه المسبار إلى «أمس».
      # MODE يمرّ عبر البيئة كذلك، ويُقارن داخل الصدفة بقيمة حرفية واحدة —
      # فحتى لو وصلت قيمة غير متوقعة لا تتحول إلى أمر يُنفَّذ.
      - name: Run xG probe
        env:
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          PROBE_DAY: ${{ inputs.day }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "table" ]; then
            python sportmonks_shadow.py --table $PROBE_DAY
          else
            python sportmonks_shadow.py --probe $PROBE_DAY
          fi
