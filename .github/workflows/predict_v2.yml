name: Daily Predictions V2

on:
  schedule:
    - cron: "30 3 * * *"    # يومياً 03:30 UTC = 06:30 صباحاً بتوقيت السعودية (بعد المحرك 1 بربع ساعة)
    - cron: "30 4 * * *"    # تشغيلة احتياطية إذا أهملت GitHub الأولى (تُتخطى إن نجحت)
  workflow_dispatch:         # زر تشغيل يدوي

permissions:
  contents: write

concurrency:
  group: football-monitor
  cancel-in-progress: false

jobs:
  predict_v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # حارس التشغيلة الاحتياطية: إذا نجحت تشغيلة اليوم مسبقاً نتخطى (للجدولة فقط)
      - name: Skip if already ran today
        id: guard
        if: github.event_name == 'schedule'
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          try:
              lr = ((json.load(open("predictions_v2.json", encoding="utf-8")).get("meta") or {}).get("last_run") or "")
          except Exception:
              lr = ""
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          print("skip=" + ("true" if lr[:10] == today else "false"))
          EOF

      - name: Run V2 predictions
        if: steps.guard.outputs.skip != 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BROADCAST_IDS: ${{ secrets.TELEGRAM_BROADCAST_IDS }}
        run: python predict_v2.py

      # 🔬 مجمّع ظل xG (المرحلة أ، 2026-08-12): قياس صامت بصفر تأثير على المحرك —
      # يعمل بعد التقييم الصباحي، وفشله لا يفشّل التشغيلة أبداً (عقيدة الظل أولاً)
      - name: Sportmonks xG shadow collector
        if: steps.guard.outputs.skip != 'true'
        env:
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
        run: python sportmonks_shadow.py || echo "🔬 المجمّع فشل صامتاً — التشغيلة سليمة"

      - name: Update dashboard data
        if: always()
        run: python dashboard_update.py

      # if: always() (إصلاح 2026-08-14): عند رفض المزوّد يسقط المحرك عمداً —
      # ولا بد أن ينجو علم مانع التكرار في state.json، وإلا كررت التشغيلة
      # الاحتياطية (04:30) نفس الإنذار بعد ساعة واحدة.
      - name: Save data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # نُدرج كل ما أنتجته التشغيلة (إصلاح 2026-08-09) — انظر monitor.yml:
          # القائمة اليدوية تترك أي ملف غير مُدرَج معدَّلاً فيرفض git الـ rebase وتضيع البيانات.
          git add -A
          git diff --cached --quiet || git commit -m "engine 2 predictions [skip ci]"
          # دفع مع إعادة المحاولة: عند تعارض مع commit موازٍ نحتفظ بملفاتنا المولّدة (الأحدث)
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = "1" ]
