name: Football Monitor

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
   # كل 10 دقائق — تنبيهات أسرع للأهداف (خطة Pro تتحمل الاستهلاك بسهولة)
  workflow_dispatch:          # زر تشغيل يدوي للتجربة
    inputs:
      prematch_window:
        description: "نافذة تقرير ما قبل المباراة بالدقائق (فارغ = 45)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write        # يلزم حارس الجدولة لتشغيل توقعات فاتها موعدها

concurrency:
  group: football-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # 🛟 الحارس الخارجي المستقل (مفتاح الرجل الميت — حادثة الصمت 2026-08-14):
      # يتحقق أن history.json تقدّم اليوم، أي أن التقييم الصباحي جرى فعلاً.
      # يعمل **قبل** المحرك وبصفر نداءات API فلا يعتمد على نجاح أي محرك —
      # حارس يسكن داخل ما يحرسه ليس حارساً. فشله لا يُسقط التشغيلة أبداً.
      - name: External dead-man switch
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BROADCAST_IDS: ${{ secrets.TELEGRAM_BROADCAST_IDS }}
        run: python deadman.py || echo "🛟 الحارس الخارجي فشل — التشغيلة تكمل"

      # أوامر تيليجرام: قائمة التركيز + تشغيل المسح الحي برسالة
      - name: Telegram commands & watchlist
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watchlist.py

      - name: Run monitor
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BROADCAST_IDS: ${{ secrets.TELEGRAM_BROADCAST_IDS }}
          PREMATCH_WINDOW: ${{ github.event.inputs.prematch_window }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # نشر الرادار الحي إلى فرع radar-live
          # 🔬 xG الحي في الظل — غياب المفتاح = تخطٍ صامت تام، لا عطل
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
        run: python monitor.py

      # الخطوات التالية بـ if: always() (إصلاح 2026-08-14): المراقب صار يسقط
      # عمداً عند رفض المزوّد (ApiRefused) — بلا هذا الشرط يُتخطى حفظ الحالة،
      # فيضيع علم مانع التكرار وتتكرر رسالة الإنذار كل عشر دقائق، ويُتخطى
      # معه حارس الجدولة وهو أحوج ما نكون إليه ساعة العطل.
      - name: Update dashboard data
        if: always()
        run: python dashboard_update.py

      # حارس الجدولة: إذا أهملت GitHub تشغيلات التوقعات اليومية يشغّلها بنفسه
      - name: Scheduler watchdog
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watchdog.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # نُدرج كل ما أنتجته التشغيلة (إصلاح 2026-08-09): القائمة اليدوية كانت
          # تترك أي ملف جديد غير مُدرَج معدَّلاً في شجرة العمل، فيرفض git الـ rebase
          # بـ "cannot pull with rebase: You have unstaged changes" وتضيع بيانات
          # التشغيلة كاملة. __pycache__ مستبعَد أصلاً في .gitignore.
          git add -A
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          # دفع مع إعادة المحاولة: عند تعارض مع commit موازٍ نحتفظ بملفاتنا المولّدة (الأحدث)
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = "1" ]
